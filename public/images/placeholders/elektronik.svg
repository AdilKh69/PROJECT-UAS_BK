<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#EBF5F3" />
  <!-- Minimal Line Art Laptop (Persis Referensi Gambar 1) -->
  <g stroke="#0F5B54" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(100, 60)">
    <!-- Screen -->
    <rect x="15" y="10" width="70" height="46" rx="4" />
    <!-- Screen Stand / Base -->
    <path d="M 0 65 L 100 65" />
    <path d="M 40 65 L 60 65" stroke-width="4" stroke="#0F5B54" />
  </g>
</svg>