<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#EBF5F3" />
  <!-- Minimal Line Art Key (Persis Referensi Gambar 4) -->
  <g stroke="#0F5B54" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(115, 65)">
    <!-- Key Ring/Head -->
    <circle cx="22" cy="45" r="14" />
    <!-- Key Shaft -->
    <line x1="32" y1="35" x2="68" y2="10" />
    <!-- Key Teeth -->
    <line x1="56" y1="18" x2="63" y2="25" />
    <line x1="68" y1="10" x2="74" y2="16" />
  </g>
</svg>